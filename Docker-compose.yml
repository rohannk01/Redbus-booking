version: "3.8"

services:
  backend:
    build:
      context: ./Backend
    container_name: redbus_backend
    ports:
      - "3020:3020"
    env_file:
      - ./config.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: redbus_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped